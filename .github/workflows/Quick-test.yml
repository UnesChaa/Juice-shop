name: Automated Pentest CI V2

on:
  pull_request:
  workflow_dispatch:
  
permissions:
   contents: read
   pull-requests: write
   security-events: write
  
jobs:
  CodeQL--npm_audit:
    runs-on: ubuntu-latest

    steps:
    # ===============================
    # Checkout & Setup
    # ===============================
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    # ===============================
    # CodeQL (SAST)
    # ===============================
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript

    - name: Get Node version
      id: node
      run: |
        echo "version=$(node -v)" >> $GITHUB_OUTPUT

    - name: Cache node_modules
      uses: actions/cache@v3
      with:
        path: |
            ~/.npm
            **/node_modules
        key: ${{ runner.os }}-node-${{ steps.node.outputs.version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm install

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

    # ===============================
    # Supply-Chain Security
    # ===============================

    - name: npm Audit
      run: npm audit --audit-level=high || true # continue the scan even if high or critical alerts were found

    #--  repos that belong to a GitHub organization account will have to obtain a free license  --#
    #- name: Secrets Scan — Gitleaks
    #  uses: gitleaks/gitleaks-action@v2.3.4
  
  Zap-scan:
    runs-on: ubuntu-latest

    steps:
    # ===============================
    # Checkout & Setup
    # ===============================
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Get Node version
      id: node
      run: |
        echo "version=$(node -v)" >> $GITHUB_OUTPUT

    - name: Cache node_modules
      uses: actions/cache@v3
      with:
        path: |
            ~/.npm
            **/node_modules
        key: ${{ runner.os }}-node-${{ steps.node.outputs.version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
        
    - name: Install dependencies
      run: npm install

    # ===============================
    # Start & Test Application
    # ===============================
    - name: Start Juice Shop
      run: |
        nohup npm start > juice-shop.log 2>&1 & disown

    - name: Wait for server
      run: npx wait-on http://localhost:3000 --timeout 120000

    - name: Smoke test
      run: curl -fI http://localhost:3000
    # ===============================
    # ZAP Baseline
    # ===============================
    
    - name: run ZAP baseline scan
      uses: zaproxy/action-baseline@v0.15.0
      with:
          target: "http://localhost:3000"
          fail_action: false
          cmd_options: >
            -a
            -j
            -J zap_report.json     
            
    - name: Upload ZAP Baseline Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: zap-baseline-scan
          path: |
            zap_report.json
            zap_report.html
            
     #-------Summary in Run-------# 
    - name: ZAP Alert Summary
      id: zap_summary

      run: | 
         echo "##  OWASP ZAP Baseline Scan Summary" >> $GITHUB_STEP_SUMMARY
         HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' zap_report.json)
         MEDIUM=$(jq '[.site[].alerts[] | select(.riskcode == "2")] | length' zap_report.json)
         LOW=$(jq '[.site[].alerts[] | select(.riskcode == "1")] | length' zap_report.json)
         INFO=$(jq '[.site[].alerts[] | select(.riskcode == "0")] | length' zap_report.json)
         
         echo "|  Severity | Count |" >> $GITHUB_STEP_SUMMARY
         echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
         echo "| 🔴 High   | $HIGH |" >> $GITHUB_STEP_SUMMARY
         echo "| 🟠 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
         echo "| 🟡 Low    | $LOW |" >> $GITHUB_STEP_SUMMARY
         echo "| 🔵 Info   | $INFO |" >> $GITHUB_STEP_SUMMARY
         
         {
         echo "ZAP_HIGH=$HIGH"
         echo "ZAP_MEDIUM=$MEDIUM"
         echo "ZAP_LOW=$LOW"
         echo "ZAP_INFO=$INFO"
         } >> $GITHUB_ENV


    #-------Summary in PR comments-------#
    
    - name: Comment ZAP Baseline Summary on PR
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
           ## 🛡️ OWASP ZAP Baseline Scan Results

           | Severity | Count |
           |---------|-------|
           | 🔴 High | ${{ env.ZAP_HIGH }} |
           | 🟠 Medium | ${{ env.ZAP_MEDIUM }} |
           | 🟡 Low | ${{ env.ZAP_LOW }} |
           | 🔵 Info | ${{ env.ZAP_INFO }} |

           📎 Full report is available in the workflow artifacts.

          
